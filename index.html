<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incidentes barriales · Santa Fe</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnBarrios" aria-label="Ver barrios">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Incidentes barriales</h1>
        <p>Municipalidad de Santa Fe · prototipo</p>
      </div>
    </div>
    <div class="topbar-stats" id="stats"></div>
  </header>

  <div class="layout">

    <!-- ===== LISTA DE BARRIOS ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sheet-handle only-mobile"></div>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="buscar" type="search" placeholder="Buscar barrio…" autocomplete="off">
        </label>
        <button class="all-city" id="btnCiudad">
          <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>
          Ver toda la ciudad
        </button>
      </div>
      <nav class="barrio-list" id="listaBarrios" aria-label="Barrios"></nav>
      <p class="sidebar-foot">Datos de ejemplo inspirados en reclamos vecinales publicados por medios locales.</p>
    </aside>

    <!-- ===== MAPA ===== -->
    <main class="map-wrap">
      <div id="map"></div>

      <div class="map-header" id="mapHeader">
        <div>
          <span class="mh-distrito" id="mhDistrito">Ciudad de Santa Fe</span>
          <h2 id="mhNombre">Todos los barrios</h2>
          <p id="mhRef" class="mh-ref"></p>
        </div>
      </div>

      <div class="filters" id="filtros">
        <div class="filter-group" id="filtroEstados"></div>
        <div class="filter-group" id="filtroTipos"></div>
      </div>
    </main>

    <!-- ===== PANEL DE DETALLE / HISTORIAL ===== -->
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="sheet-handle only-mobile"></div>
      <button class="icon-btn drawer-close" id="cerrarDrawer" aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="drawerBody"></div>
    </aside>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="toast" id="toast" role="status"></div>

  <!-- Datos (formato JSON dentro de .js para que funcione con doble clic, sin servidor) -->
  <script src="data/barrios.js"></script>
  <script src="data/incidentes.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
